name: Update exhibitions

on:
  schedule:
    # 매일 21:00 UTC = 06:00 KST 자동 갱신
    - cron: "0 21 * * *"
  workflow_dispatch:        # 버튼으로 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch exhibitions
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: python scripts/fetch_exhibitions.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/exhibitions.json; then
            git add data/exhibitions.json
            git commit -m "data: update exhibitions ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi
